services:
  friendsdebt.api:
    image: friendsdebt.api
    build:
      context: .
      dockerfile: FriendsDebt.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Database__ApplyMigrationsOnStartup: true
      HttpsRedirection__Enabled: false
      FRIENDSDEBT_DB_CONNECTION_STRING: Host=friendsdebt.db;Port=5432;Database=friendsdebt;Username=friendsdebt;Password=${POSTGRES_PASSWORD:-friendsdebt}
    ports:
      - "8080:8080"
    volumes:
      - friendsdebt-dataprotection:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      friendsdebt.db:
        condition: service_healthy

  friendsdebt.db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: friendsdebt
      POSTGRES_USER: friendsdebt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friendsdebt}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendsdebt -d friendsdebt"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - friendsdebt-postgres:/var/lib/postgresql/data

volumes:
  friendsdebt-postgres:
  friendsdebt-dataprotection:
